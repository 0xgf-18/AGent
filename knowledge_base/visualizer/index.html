<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Skill Graph</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Force Graph Library (2D Canvas Engine) -->
  <script src="https://unpkg.com/force-graph@1.43.4/dist/force-graph.min.js"></script>

  <!-- Marked Markdown Renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Load Graph Data -->
  <script src="graph_data.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 18, 30, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #graph-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Single Unified Top Control Bar (two rows: actions + wrapping pills) */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      max-width: calc(100vw - 40px);
      pointer-events: none; /* Let background clicks pass through */
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }

    .stats-badge {
      font-size: 0.75rem;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 7px 12px 7px 34px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
      width: 260px;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
    }

    /* Filter Pills Bar — wraps inside the viewport, never runs off-screen */
    .filter-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 100%;
      padding: 4px 2px;
      pointer-events: auto;
    }

    .pill {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .pill:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(30, 41, 59, 0.9);
    }

    .pill.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Action Buttons */
    .btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--accent-purple);
      color: #fff;
    }

    /* Side Inspector Drawer */
    .drawer {
      position: absolute;
      top: 0;
      right: -480px;
      width: 460px;
      height: 100vh;
      background: rgba(10, 14, 24, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--panel-border);
      z-index: 20;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -20px 0 40px rgba(0, 0, 0, 0.7);
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .drawer-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drawer-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .drawer-body {
      padding: 24px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .meta-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .summary-card {
      background: rgba(30, 41, 59, 0.4);
      border-left: 3px solid var(--accent-purple);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #93c5fd;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .link-item:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .path-box {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      word-break: break-all;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .preview-box {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 260px;
      overflow-y: auto;
    }

    /* Hover Tooltip */
    #tooltip {
      position: absolute;
      z-index: 15;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      pointer-events: none;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    #tooltip strong {
      display: block;
      color: #fff;
      margin-bottom: 2px;
    }

    #tooltip span {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    #tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ================= Animated Aurora Background ================= */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      filter: blur(70px);
      opacity: 0.6;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: drift 26s ease-in-out infinite alternate;
    }

    .blob.b1 {
      width: 55vw; height: 55vw;
      left: -15vw; top: -20vh;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.30), transparent 65%);
    }

    .blob.b2 {
      width: 45vw; height: 45vw;
      right: -12vw; top: 8vh;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.26), transparent 65%);
      animation-duration: 32s;
      animation-delay: -8s;
    }

    .blob.b3 {
      width: 50vw; height: 50vw;
      left: 28vw; bottom: -26vh;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.20), transparent 65%);
      animation-duration: 38s;
      animation-delay: -16s;
    }

    .blob.b4 {
      width: 30vw; height: 30vw;
      right: 18vw; bottom: -10vh;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.16), transparent 65%);
      animation-duration: 44s;
      animation-delay: -22s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%  { transform: translate(6vw, -5vh) scale(1.18) rotate(40deg); }
      100% { transform: translate(-5vw, 6vh) scale(0.92) rotate(-30deg); }
    }

    /* Fading perspective grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
      animation: gridPulse 12s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.9; }
    }

    /* ================= Boot Loader ================= */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid rgba(168, 85, 247, 0.15);
      border-top-color: var(--accent-purple);
      border-right-color: var(--accent-blue);
      animation: spin 0.9s linear infinite;
    }

    .loader-text {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: fadePulse 1.4s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    /* ================= Entry Animations ================= */
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .top-row    { animation: dropIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both 0.1s; }
    .filter-pills { animation: dropIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both 0.22s; }

    /* Staggered drawer content */
    .drawer-body.stagger > div {
      animation: riseIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .drawer-body.stagger > div:nth-child(1) { animation-delay: 0.06s; }
    .drawer-body.stagger > div:nth-child(2) { animation-delay: 0.14s; }
    .drawer-body.stagger > div:nth-child(3) { animation-delay: 0.22s; }
    .drawer-body.stagger > div:nth-child(4) { animation-delay: 0.30s; }

    /* ================= Glassmorphism Upgrades ================= */
    .glass-card {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015)),
        rgba(13, 18, 30, 0.72);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Animated gradient hairline border */
    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg,
        rgba(168, 85, 247, 0.6),
        rgba(59, 130, 246, 0.3),
        rgba(255, 255, 255, 0.12),
        rgba(16, 185, 129, 0.35));
      background-size: 300% 300%;
      animation: borderFlow 9s ease infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
      z-index: 0;
    }

    /* Specular sweep across glass */
    .glass-card::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -80%;
      width: 60%;
      height: 220%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      transform: rotate(18deg);
      animation: sweep 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .glass-card > * { position: relative; z-index: 1; }

    @keyframes borderFlow {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    @keyframes sweep {
      0%, 55%  { left: -80%; opacity: 0; }
      62%      { opacity: 1; }
      85%, 100%{ left: 130%; opacity: 0; }
    }

    .stats-badge {
      background: linear-gradient(120deg,
        rgba(168, 85, 247, 0.18), rgba(59, 130, 246, 0.18), rgba(168, 85, 247, 0.18));
      background-size: 220% 220%;
      animation: borderFlow 6s ease infinite;
    }

    /* ================= Pills / Buttons ================= */
    .pill {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .pill.active {
      animation: pillGlow 2.8s ease-in-out infinite;
      color: #fff;
    }

    .pill.active .pill-dot {
      animation: dotPulse 1.8s ease-in-out infinite;
      box-shadow: 0 0 8px currentColor;
    }

    @keyframes pillGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.22); }
      50%      { box-shadow: 0 0 22px rgba(168, 85, 247, 0.55); }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.7; }
    }

    .btn {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .btn.active {
      animation: pillGlow 2.2s ease-in-out infinite;
    }

    /* ================= Drawer: vertical color-flow edge ================= */
    .drawer {
      background:
        linear-gradient(160deg, rgba(15, 20, 35, 0.94), rgba(8, 10, 18, 0.97));
    }

    .drawer::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg,
        var(--accent-purple), var(--accent-blue), var(--accent-green),
        var(--accent-amber), var(--accent-purple));
      background-size: 100% 400%;
      animation: vFlow 7s linear infinite;
      z-index: 1;
    }

    @keyframes vFlow {
      from { background-position: 0 0%; }
      to   { background-position: 0 400%; }
    }

    /* Custom scrollbars */
    .drawer-body::-webkit-scrollbar,
    .preview-box::-webkit-scrollbar { width: 8px; }
    .drawer-body::-webkit-scrollbar-track,
    .preview-box::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
    .drawer-body::-webkit-scrollbar-thumb,
    .preview-box::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.5), rgba(59, 130, 246, 0.5));
      border-radius: 4px;
    }
    .drawer-body::-webkit-scrollbar-thumb:hover,
    .preview-box::-webkit-scrollbar-thumb:hover { filter: brightness(1.4); }

    /* Tooltip entrance */
    #tooltip {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    #tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ================= "Developed by Fahad" glass badge ================= */
    .dev-badge {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 12;
      display: block;
      padding: 12px 34px 16px;
      border-radius: 18px;
      text-align: center;
      pointer-events: none;
      animation:
        dropIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both 0.6s,
        devGlow 4s ease-in-out infinite 1.3s;
    }

    .dev-badge .dev-label {
      font-size: 0.6rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .dev-badge .dev-name {
      font-family: 'Great Vibes', cursive;
      font-size: 2.3rem;
      line-height: 1;
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(168, 85, 247, 0.85),
        0 0 32px rgba(168, 85, 247, 0.5),
        0 0 60px rgba(59, 130, 246, 0.35);
      position: relative;
      z-index: 1;
      animation: nameShimmer 5s ease-in-out infinite;
    }

    .dev-badge .dev-sub {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.65);
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }

    @keyframes devGlow {
      0%, 100% {
        box-shadow:
          0 0 16px rgba(168, 85, 247, 0.25),
          0 14px 36px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      50% {
        box-shadow:
          0 0 38px rgba(168, 85, 247, 0.6),
          0 0 70px rgba(59, 130, 246, 0.25),
          0 14px 36px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
    }

    @keyframes nameShimmer {
      0%, 100% {
        text-shadow:
          0 0 12px rgba(168, 85, 247, 0.85),
          0 0 32px rgba(168, 85, 247, 0.5),
          0 0 60px rgba(59, 130, 246, 0.35);
      }
      50% {
        text-shadow:
          0 0 18px rgba(168, 85, 247, 1),
          0 0 46px rgba(59, 130, 246, 0.7),
          0 0 80px rgba(16, 185, 129, 0.4);
      }
    }

    .dev-badge.dismissed {
      display: none;
    }

    /* Reduced motion: respect user preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Controls Header -->
  <div class="top-bar">
    <div class="top-row">
      <div class="glass-card">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
          </svg>
        Agent Skill Graph
      </div>
        <div class="stats-badge" id="stats-badge">37 Nodes • 111 Edges</div>

        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search node title or tag...">
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="glass-card" style="padding: 6px;">
        <button class="btn" id="btn-labels" title="Toggle Labels">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
          All Labels
        </button>
      </div>
    </div>

    <!-- Filter Pills (built dynamically from graph topics - no stale entries) -->
    <div class="filter-pills" id="filter-pills"></div>
  </div>

  <!-- Animated background layers -->
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>
  <div class="bg-grid"></div>

  <!-- Boot Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Compiling Agent Skill Graph</div>
  </div>

  <!-- Graph Container -->
  <div id="graph-container"></div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- Side Inspector Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title">Node Title</h2>
        <div class="meta-tags" id="drawer-meta-tags"></div>
      </div>
      <button class="drawer-close" id="drawer-close">&times;</button>
    </div>

    <div class="drawer-body">
      <div>
        <div class="section-title">Summary</div>
        <div class="summary-card" id="drawer-summary">Article summary...</div>
      </div>

      <div>
        <div class="section-title">File Path</div>
        <div class="path-box" id="drawer-path">knowledge_base/wiki/...</div>
      </div>

      <div>
        <div class="section-title">Connected Nodes</div>
        <div class="links-list" id="drawer-links"></div>
      </div>

      <div>
        <div class="section-title">Content Snippet</div>
        <div class="preview-box" id="drawer-preview">Markdown content preview...</div>
      </div>
    </div>
  </div>

  <!-- Developer signature badge -->
  <div class="dev-badge glass-card" id="dev-badge">
    <div class="dev-label">Developed by</div>
    <div class="dev-name">Fahad</div>
    <div class="dev-sub">Agent Skill Graph</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.GRAPH_DATA) {
        console.error("GRAPH_DATA not found in graph_data.js");
        return;
      }

      const rawData = window.GRAPH_DATA;
      const container = document.getElementById("graph-container");
      const drawer = document.getElementById("drawer");
      const drawerClose = document.getElementById("drawer-close");
      const tooltip = document.getElementById("tooltip");
      const searchInput = document.getElementById("search-input");
      const filterPills = document.getElementById("filter-pills");
      const btnLabels = document.getElementById("btn-labels");
      const statsBadge = document.getElementById("stats-badge");

      let selectedNode = null;
      let hoveredNode = null;
      let activeTopic = "all";
      let showAllLabels = false;
      let fitPending = true; // auto-fit the whole graph into the viewport
      let firstFitDone = false;
      let userInteracted = false; // user panned/zoomed — don't yank the view away
      const bootT = performance.now();

      // Keep the view inside the page: fit whenever the force layout (re)starts
      function requestFit() { fitPending = true; }

      // Hide + remove the boot loader
      function hideLoader() {
        const l = document.getElementById("loader");
        if (!l || l.classList.contains("hidden")) return;
        l.classList.add("hidden");
        setTimeout(() => l.remove(), 700);
      }

      // Hex color -> rgba() helper for canvas glow effects
      function hexA(hex, a) {
        const h = (hex || "#a855f7").replace("#", "");
        const full = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
        const n = parseInt(full, 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
      }

      // Update stats badge
      statsBadge.innerText = `${rawData.nodes.length} Nodes • ${rawData.links.length} Edges`;

      // Build filter pills dynamically from topics actually present in the data
      // (volatile topics like device environments never appear here)
      const topicColor = new Map();
      rawData.nodes.forEach(n => {
        if (!topicColor.has(n.topic)) topicColor.set(n.topic, n.color);
      });
      const topicLabel = t => t === "all" ? "All Topics"
        : t.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
      const pillsHost = document.getElementById("filter-pills");
      ["all", ...[...topicColor.keys()].filter(t => t !== "_root").sort()]
        .forEach(t => {
          const pill = document.createElement("div");
          pill.className = "pill" + (t === "all" ? " active" : "");
          pill.setAttribute("data-topic", t);
          const dot = document.createElement("span");
          dot.className = "pill-dot";
          dot.style.background = t === "all" ? "#fff" : topicColor.get(t);
          pill.appendChild(dot);
          pill.appendChild(document.createTextNode(" " + topicLabel(t)));
          pillsHost.appendChild(pill);
        });

      // Build connection set for rapid neighbor lookup
      const connectionMap = new Map();
      rawData.links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        if (!connectionMap.has(s)) connectionMap.set(s, new Set());
        if (!connectionMap.has(t)) connectionMap.set(t, new Set());
        connectionMap.get(s).add(t);
        connectionMap.get(t).add(s);
      });

      // Initialize ForceGraph Engine
      const Graph = ForceGraph()(container)
        .graphData(rawData)
        .nodeId("id")
        .minZoom(0.08)
        .maxZoom(6)
        .cooldownTime(3000) // settle in ~3s (default 15s delayed the initial fit)
        .autoPauseRedraw(false) // keep frames flowing for ambient animations
        .onEngineStop(() => {
          if (fitPending && (!firstFitDone || !userInteracted)) {
            fitPending = false;
            firstFitDone = true;
            Graph.zoomToFit(600, 110); // margin clears the top control bar
          }
          hideLoader();
        })
        .nodeVal(n => Math.min(18, 4 + Math.sqrt(n.val) * 2.2))
        .nodeColor(n => n.color || "#a855f7")
        .linkColor(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          if (hoveredNode && (s === hoveredNode.id || t === hoveredNode.id)) {
            return "#a855f7";
          }
          return "rgba(255, 255, 255, 0.12)";
        })
        .linkWidth(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          if (hoveredNode && (s === hoveredNode.id || t === hoveredNode.id)) {
            return 2.5;
          }
          return 1.2;
        })
        .linkDirectionalParticles(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          return hoveredNode && (s === hoveredNode.id || t === hoveredNode.id) ? 5 : 2;
        })
        .linkDirectionalParticleWidth(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          return hoveredNode && (s === hoveredNode.id || t === hoveredNode.id) ? 3 : 1.6;
        })
        .linkDirectionalParticleSpeed(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          return hoveredNode && (s === hoveredNode.id || t === hoveredNode.id) ? 0.014 : 0.005;
        })
        .linkDirectionalParticleColor(l => {
          const sId = typeof l.source === 'object' ? l.source.id : l.source;
          const tId = typeof l.target === 'object' ? l.target.id : l.target;
          const hot = hoveredNode && (sId === hoveredNode.id || tId === hoveredNode.id);
          if (hot) return "#ffffff";
          return (typeof l.source === 'object' && l.source.color) || "#a855f7";
        })
        .backgroundColor("rgba(0, 0, 0, 0)")
        .onNodeHover(node => {
          // Press-and-hold: leaving the held node cancels the hold / zooms out
          // (ignored briefly while the zoom-in animation re-anchors the cursor)
          if (holdNode && performance.now() > holdGuardUntil &&
              (!node || node.id !== holdNode.id)) {
            if (holdTimer) cancelHold();
            if (holdZoomActive) exitHoldZoom();
          }
          hoveredNode = node;
          container.style.cursor = node ? "pointer" : "default";
          if (node) {
            tooltip.style.display = "block";
            tooltip.innerHTML = `<strong>${node.title}</strong><span>Topic: ${node.topic.toUpperCase()} • ${node.type}</span>`;
            requestAnimationFrame(() => tooltip.classList.add("show"));
          } else {
            tooltip.classList.remove("show");
            setTimeout(() => {
              if (!tooltip.classList.contains("show")) tooltip.style.display = "none";
            }, 180);
          }
        })
        .onNodeClick(node => {
          if (suppressClick) { suppressClick = false; return; } // hold-zoom, not a click
          openDrawer(node);
          Graph.centerAt(node.x, node.y, 400);
          Graph.zoom(2.8, 400);
        })
        .nodeCanvasObject((node, ctx, globalScale) => {
          // Node positions can be undefined for the first ticks — skip safely
          if (!Number.isFinite(node.x) || !Number.isFinite(node.y)) return;

          const now = performance.now();
          const radius = Math.min(18, 4 + Math.sqrt(node.val) * 2.2);
          if (!Number.isFinite(radius)) return;
          const color = node.color || "#a855f7";

          // Neighbor math
          const nbrs = hoveredNode && connectionMap.get(hoveredNode.id);
          const isHovered = hoveredNode && hoveredNode.id === node.id;
          const isNeighbor = !!(nbrs && nbrs.has(node.id));
          const isMaster = node.topic === "_root" || node.id.includes("_index") || node.id.includes("hub");
          const isSelected = selectedNode && selectedNode.id === node.id;
          const isHot = isHovered || isNeighbor;

          // Entry fade-in + hover dimming (optical focus)
          const intro = Math.min(1, (now - bootT) / 900);
          const dimmed = hoveredNode && !isHot && !isSelected;
          ctx.save();
          ctx.globalAlpha = intro * (dimmed ? 0.22 : 1);

          // Ambient halo glow (breathing)
          const breathe = 0.5 + 0.5 * Math.sin(now / 600 + node.x * 0.013);
          const haloR = radius * (2.3 + breathe * 0.35);
          const halo = ctx.createRadialGradient(node.x, node.y, radius * 0.4, node.x, node.y, haloR);
          halo.addColorStop(0, hexA(color, isHot ? 0.4 : 0.24 + breathe * 0.10));
          halo.addColorStop(0.55, hexA(color, isHot ? 0.14 : 0.07));
          halo.addColorStop(1, hexA(color, 0));
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(node.x, node.y, haloR, 0, 2 * Math.PI);
          ctx.fill();

          // Breathing outline ring
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius + 3 + breathe * 3, 0, 2 * Math.PI);
          ctx.strokeStyle = hexA(color, isHot ? 0.55 : 0.15 + breathe * 0.14);
          ctx.lineWidth = (isHot ? 1.8 : 1) / globalScale;
          ctx.stroke();

          // Main node sphere
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
          ctx.fillStyle = color;
          ctx.fill();

          // Glass specular highlight (top arc)
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius * 0.72, Math.PI * 1.12, Math.PI * 1.88);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
          ctx.lineWidth = Math.max(1, radius * 0.16);
          ctx.lineCap = "round";
          ctx.stroke();

          // Selection: pulsing double ring
          if (isSelected) {
            const p = 0.5 + 0.5 * Math.sin(now / 280);
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius + 6 + p * 4, 0, 2 * Math.PI);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.9 - p * 0.5})`;
            ctx.lineWidth = 2 / globalScale;
            ctx.stroke();
          }

          // Press-and-hold progress ring (hold 2s → zoom in)
          if (holdNode && node.id === holdNode.id && holdStart) {
            const frac = holdTimer ? Math.min(1, (now - holdStart) / HOLD_MS) : 1;
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius + 9,
              -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
            ctx.lineWidth = 3 / globalScale;
            ctx.lineCap = "round";
            ctx.stroke();
            if (frac >= 1) {
              // Full ring: soft glow pulse while zoomed in
              ctx.beginPath();
              ctx.arc(node.x, node.y, radius + 13, 0, 2 * Math.PI);
              ctx.strokeStyle = hexA(color, 0.35 + 0.25 * Math.sin(now / 220));
              ctx.lineWidth = 2 / globalScale;
              ctx.stroke();
            }
          }

          // CLEAN SMART LABEL RENDERING Logic (Prevents Overlap Clutter!)
          const highZoom = globalScale > 2.2;

          if (showAllLabels || isHot || isSelected || isMaster || highZoom) {
            const fontSize = Math.max(10 / globalScale, 3);
            ctx.font = `${fontSize}px Inter, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const text = node.title;
            const textWidth = ctx.measureText(text).width;
            const padding = 3 / globalScale;
            const yPos = node.y + radius + fontSize + 5;

            // Semi-transparent text background pill for crisp legibility
            ctx.fillStyle = "rgba(7, 9, 14, 0.85)";
            ctx.fillRect(
              node.x - textWidth / 2 - padding,
              yPos - fontSize / 2 - padding,
              textWidth + padding * 2,
              fontSize + padding * 2
            );

            // Label text
            ctx.fillStyle = isHot || isSelected || isMaster ? "#ffffff" : "#cbd5e1";
            ctx.fillText(text, node.x, yPos);
          }

          ctx.restore();
        });

      // Tune D3 Force Physics for Clean Cluster Spacing
      Graph.d3Force('charge').strength(-240);
      Graph.d3Force('link').distance(60);

      // Loader safety fallback (in case the engine never cools)
      setTimeout(hideLoader, 3500);

      // First-fit safety net (if the engine never reports a stop)
      setTimeout(() => {
        if (!firstFitDone) {
          fitPending = false;
          firstFitDone = true;
          Graph.zoomToFit(600, 110);
        }
      }, 5000);

      // Track genuine user pan/zoom so auto-refit never fights the user
      container.addEventListener("wheel", () => { userInteracted = true; }, { passive: true });
      container.addEventListener("pointermove", (e) => {
        if (e.buttons) userInteracted = true;
      });

      // Tooltip position tracking
      window.addEventListener("mousemove", (e) => {
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });

      // Drawer Open Handler
      function openDrawer(node) {
        selectedNode = node;
        document.getElementById("drawer-title").innerText = node.title;
        document.getElementById("drawer-summary").innerText = node.summary;
        document.getElementById("drawer-path").innerText = node.rel_path;
        
        const tagsContainer = document.getElementById("drawer-meta-tags");
        tagsContainer.innerHTML = `
          <span class="meta-tag" style="border-color: ${node.color}; color: ${node.color}">${node.topic.toUpperCase()}</span>
          <span class="meta-tag">${node.type}</span>
          <span class="meta-tag">${node.complexity}</span>
        `;

        const linksContainer = document.getElementById("drawer-links");
        linksContainer.innerHTML = "";
        
        const connections = connectionMap.get(node.id) || new Set();
        if (connections.size === 0) {
          linksContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted);">No direct links discovered.</div>`;
        } else {
          connections.forEach(targetId => {
            const targetNode = rawData.nodes.find(n => n.id === targetId);
            if (targetNode) {
              const linkEl = document.createElement("div");
              linkEl.className = "link-item";
              linkEl.innerHTML = `<span>${targetNode.title}</span><span style="font-size:0.72rem; color:var(--text-muted)">${targetNode.topic}</span>`;
              linkEl.onclick = () => {
                openDrawer(targetNode);
                Graph.centerAt(targetNode.x, targetNode.y, 400);
              };
              linksContainer.appendChild(linkEl);
            }
          });
        }

        const previewContainer = document.getElementById("drawer-preview");
        if (window.marked) {
          previewContainer.innerHTML = marked.parse(node.content || "");
        } else {
          previewContainer.innerText = node.content || "";
        }

        // Staggered content entrance (restart every time the drawer opens)
        const body = document.querySelector(".drawer-body");
        body.classList.remove("stagger");
        void body.offsetWidth;
        body.classList.add("stagger");

        drawer.classList.add("open");
      }

      function closeDrawer() {
        drawer.classList.remove("open");
        selectedNode = null;
      }

      drawerClose.addEventListener("click", closeDrawer);
      Graph.onBackgroundClick(closeDrawer);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDrawer();
      });

      // Developer badge (permanent — no dismiss)

      // ============ Press-and-Hold Zoom (hold a node 2s → zoom in, release/leave → zoom out) ============
      const HOLD_MS = 2000;
      let holdTimer = null;        // pending hold timer
      let holdStart = 0;           // timestamp for the progress ring
      let holdNode = null;         // node being held
      let holdZoomActive = false;  // currently zoomed in via hold
      let prevView = null;         // view to restore on release
      let suppressClick = false;   // swallow the deferred click after a hold-zoom
      let holdGuardUntil = 0;      // ignore hover-leave while zooming in
      const lastPointer = { x: 0, y: 0 };

      function cancelHold() {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = null;
        holdStart = 0;
        holdNode = null;
      }

      function startHold(node) {
        cancelHold();
        holdNode = node;
        holdStart = performance.now();
        holdTimer = setTimeout(() => {
          holdTimer = null;
          if (hoveredNode && holdNode && hoveredNode.id === holdNode.id) {
            enterHoldZoom(holdNode);
          } else {
            cancelHold();
          }
        }, HOLD_MS);
      }

      function enterHoldZoom(node) {
        prevView = { zoom: Graph.zoom(), ...Graph.centerAt() };
        const target = Math.min(6, Math.max(prevView.zoom * 3.5, prevView.zoom + 2));
        const W = Graph.width(), H = Graph.height();
        // Keep the node exactly under the cursor while zooming in
        const cx = node.x - (lastPointer.x - W / 2) / target;
        const cy = node.y - (lastPointer.y - H / 2) / target;
        Graph.centerAt(cx, cy, 500);
        Graph.zoom(target, 500);
        holdZoomActive = true;
        suppressClick = true;
        holdGuardUntil = performance.now() + 750;
      }

      function exitHoldZoom() {
        if (!holdZoomActive) return;
        holdZoomActive = false;
        const v = prevView;
        prevView = null;
        if (v) {
          Graph.centerAt(v.x, v.y, 500);
          Graph.zoom(v.zoom, 500);
        }
        cancelHold();
      }

      // Track pointer position (for cursor-anchored zoom-in)
      container.addEventListener("pointermove", (e) => {
        const r = container.getBoundingClientRect();
        lastPointer.x = e.clientX - r.left;
        lastPointer.y = e.clientY - r.top;
      });

      // Hold starts when pressing down on a node
      container.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        exitHoldZoom(); // reset any previous hold-zoom first
        suppressClick = false;
        if (hoveredNode) startHold(hoveredNode);
      });

      // Releasing the pointer zooms back out
      const releaseHold = () => {
        if (holdZoomActive) exitHoldZoom();
        else cancelHold();
      };
      container.addEventListener("pointerup", releaseHold);
      container.addEventListener("pointercancel", releaseHold);
      container.addEventListener("pointerleave", releaseHold);

      // Topic Filter Pills
      filterPills.addEventListener("click", (e) => {
        const pill = e.target.closest(".pill");
        if (!pill) return;

        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        activeTopic = pill.getAttribute("data-topic");

        filterGraph();
      });

      // Search Bar Filter
      searchInput.addEventListener("input", () => {
        filterGraph();
      });

      // Re-fit on window resize so the graph always stays on the page
      window.addEventListener("resize", () => {
        fitPending = false;
        Graph.zoomToFit(300, 110);
      });

      // Toggle All Labels Button
      btnLabels.addEventListener("click", () => {
        showAllLabels = !showAllLabels;
        btnLabels.classList.toggle("active", showAllLabels);
      });

      function filterGraph() {
        const query = searchInput.value.toLowerCase().trim();

        const filteredNodes = rawData.nodes.filter(node => {
          const matchesTopic = activeTopic === "all" || node.topic === activeTopic;
          const matchesSearch = !query || 
            node.title.toLowerCase().includes(query) || 
            node.summary.toLowerCase().includes(query) ||
            (node.tags && node.tags.some(t => t.toLowerCase().includes(query)));

          return matchesTopic && matchesSearch;
        });

        const filteredNodeIds = new Set(filteredNodes.map(n => n.id));
        const filteredLinks = rawData.links.filter(l => {
          const sId = typeof l.source === 'object' ? l.source.id : l.source;
          const tId = typeof l.target === 'object' ? l.target.id : l.target;
          return filteredNodeIds.has(sId) && filteredNodeIds.has(tId);
        });

        userInteracted = false; // a filter change deserves a fresh fit
        requestFit();
        Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
      }
    });
  </script>
</body>
</html>
